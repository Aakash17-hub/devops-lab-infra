---
- name: Baseline hardening for every lab host
  hosts: all
  become: true
  roles:
    - ssh-hardening
    - fail2ban

- name: App host (Docker, Nginx blue/green, GitLab Runner)
  hosts: app-server
  become: true
  roles:
    - app-host

- name: GitLab server
  hosts: git-server
  become: true
  roles:
    - gitlab

- name: Jenkins server
  hosts: jenkins-server
  become: true
  roles:
    - jenkins
