---
# Key-only SSH and no root login, written as one drop-in on every host.
# Ubuntu reads /etc/ssh/sshd_config.d/*.conf before the main file, so the drop-in wins.

- name: Ensure the admin group exists
  ansible.builtin.group:
    name: labadmins
    state: present

- name: Add the login user to the admin group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: labadmins
    append: true

- name: Write the SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      MaxAuthTries 3
      X11Forwarding no
  notify: Restart ssh

- name: Remove the older drop-in (only jenkins-server had it)
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    state: absent
  notify: Restart ssh

- name: Check the full sshd config before any restart
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false